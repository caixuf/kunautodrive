<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowEngine · 综合 3D 场景展示</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #0d1117; color: #c9d1d9;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
  }
  /* ── 左侧场景列表（可收起抽屉，默认收起让 3D 独占整页）── */
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
    width: 260px; height: 100vh;
    background: #161b22ee; backdrop-filter: blur(10px);
    border-right: 1px solid #21262d;
    display: flex; flex-direction: column;
    transition: transform .22s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.45);
  }
  body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
  #sidebar h1 {
    font-size: 15px; margin: 0; padding: 14px 16px;
    color: #58a6ff; border-bottom: 1px solid #21262d;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #sidebar h1 small { display: block; color: #8b949e; font-size: 11px; font-weight: 400; margin-top: 2px; }
  #sidebar-close-btn {
    border: 1px solid #30363d; background: #21262d; color: #c9d1d9;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  #sidebar-close-btn:hover { background: #30363d; color: #fff; }
  #sidebar-toggle-btn {
    position: absolute; top: 12px; left: 14px; z-index: 15;
    padding: 6px 12px; border: 1px solid #30363d; border-radius: 8px;
    background: #161b22cc; backdrop-filter: blur(8px);
    color: #c9d1d9; font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #sidebar-toggle-btn:hover { background: #21262d; color: #fff; border-color: #58a6ff; }
  body:not(.sidebar-collapsed) #sidebar-toggle-btn { display: none; }
  #scene-list { flex: 1; overflow-y: auto; padding: 8px; }
  .scene-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; margin: 0 0 4px; border: 1px solid transparent;
    border-radius: 6px; background: transparent; color: #c9d1d9;
    font: inherit; text-align: left; cursor: pointer;
  }
  .scene-item:hover { background: #1f2630; }
  .scene-item.active { background: #1f6feb33; border-color: #1f6feb; color: #fff; }
  .scene-idx { color: #6e7681; font-variant-numeric: tabular-nums; font-size: 11px; }
  .scene-item.active .scene-idx { color: #58a6ff; }
  .scene-name { flex: 1; }
  .disabled-scene .scene-name { color: #8b949e; }
  /* ── 主区（100vw × 100vh 独占整页）── */
  #main { flex: 1; width: 100vw; height: 100vh; position: relative; }
  #scene3d-canvas { display: block; width: 100%; height: 100%; }
  #topbar {
    position: absolute; top: 0; left: 112px; right: 0; z-index: 5;
    padding: 10px 16px; background: linear-gradient(#0d1117aa, #0d111700);
    pointer-events: none;
  }
  #scene-title { font-size: 18px; font-weight: 600; color: #fff; }
  #scene-desc { color: #c9d1d9; margin-top: 2px; max-width: 60ch; }
  #scene-meta { color: #8b949e; margin-top: 4px; font-size: 12px; }
  #controls {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 5; display: flex; gap: 6px;
    background: #161b22cc; padding: 6px; border-radius: 8px; border: 1px solid #21262d;
  }
  .cam-btn {
    padding: 6px 12px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #c9d1d9; font: inherit; cursor: pointer;
  }
  .cam-btn:hover { background: #2d333b; }
  .cam-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #showcase-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 6; background: #161b22ee; color: #c9d1d9;
    padding: 12px 18px; border-radius: 8px; border: 1px solid #30363d; max-width: 70ch;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/tools/flowboard/vendor/three/three.module.js",
    "three/addons/": "/tools/flowboard/vendor/three/jsm/"
  }
}
</script>
</head>
<body class="sidebar-collapsed">
  <aside id="sidebar">
    <h1><span>综合 3D 场景展示<small>FlowEngine scenario gallery</small></span><button id="sidebar-close-btn" type="button" title="收起列表">✕</button></h1>
    <div id="scene-list"></div>
  </aside>
  <div id="main">
    <button id="sidebar-toggle-btn" type="button" title="展开场景列表 (L)">☰ 场景列表</button>
    <canvas id="scene3d-canvas"></canvas>
    <div id="topbar">
      <div id="scene-title">加载中…</div>
      <div id="scene-desc"></div>
      <div id="scene-meta"></div>
    </div>
    <div id="controls">
      <button class="cam-btn active" data-cam="chase">追尾</button>
      <button class="cam-btn" data-cam="orbit">环绕</button>
      <button class="cam-btn" data-cam="top">俯视</button>
      <button class="cam-btn" data-cam="driver">驾驶</button>
      <button class="cam-btn" data-cam="front">前视</button>
    </div>
    <div id="showcase-msg"></div>
  </div>
  <script type="module" src="/tools/flowboard/js/bootstrap.js"></script>
  <script type="module" src="/tools/flowboard/js/showcase/main.js?v=20261111"></script>
  <script>
    (function () {
      const toggle = (force) => {
        const next = typeof force === 'boolean' ? force : !document.body.classList.contains('sidebar-collapsed');
        document.body.classList.toggle('sidebar-collapsed', next);
      };
      document.getElementById('sidebar-toggle-btn').addEventListener('click', () => toggle(false));
      document.getElementById('sidebar-close-btn').addEventListener('click', () => toggle(true));
      document.getElementById('scene-list').addEventListener('click', (e) => {
        if (e.target.closest('.scene-item')) toggle(true);
      });
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'l' || e.key === 'L') toggle();
        if (e.key === 'Escape') toggle(true);
      });
    })();
  </script>
</body>
</html>
