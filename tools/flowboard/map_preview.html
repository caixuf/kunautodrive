<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlowBoard 3D Map Preview</title>
  <style>
    html, body, #scene3d, #scene3d-canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0d14; }
    #scene3d-canvas { display: block; }
    #msg { position: absolute; inset: 0; display: grid; place-items: center; color: #8b949e; font: 13px sans-serif; pointer-events: none; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 3;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 10px;
      background: rgba(13, 17, 23, 0.78); border: 1px solid rgba(110, 118, 129, 0.35);
      color: #c9d1d9; font: 12px/1.4 system-ui, sans-serif;
      backdrop-filter: blur(10px);
    }
    #hud button {
      border: 1px solid #30363d; background: #161b22; color: #f0f6fc;
      padding: 5px 10px; border-radius: 7px; cursor: pointer; font: inherit;
    }
    #hud button:hover { background: #1f2937; }
    #hint { color: #8b949e; }
  </style>
</head>
<body>
  <div id="scene3d">
    <canvas id="scene3d-canvas"></canvas>
    <div id="hud">
      <button id="reset-view" type="button">回到路线</button>
      <span id="hint">左键拖拽平移，滚轮缩放</span>
    </div>
    <div id="msg">加载地图…</div>
  </div>
  <script type="importmap">
    {"imports":{"three":"/tools/flowboard/vendor/three/three.module.js","three/addons/":"/tools/flowboard/vendor/three/jsm/"}}
  </script>
  <script type="module" src="js/mapPreview.js?v=20260812canvas"></script>
</body>
</html>
